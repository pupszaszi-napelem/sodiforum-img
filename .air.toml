root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/sodiforum-img ."
bin = "./tmp/sodiforum-img"
full_bin = "ADDR=${ADDR:-:8080} ./tmp/sodiforum-img"
include_ext = ["go", "js", "css", "html", "tmpl"]
exclude_dir = ["bin", "tmp", "vendor", ".git"]
exclude_file = []
exclude_regex = ["_test.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
